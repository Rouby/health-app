name: CI/CD Build & Deploy

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  version-or-release:
    name: Run Changesets & Determine Version
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.release-status.outputs.should_deploy }}
      version: ${{ steps.release-status.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Corepack Enable
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Changesets Action
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn version-packages
          publish: yarn release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Release Status
        id: release-status
        run: |
          if [ "${{ steps.changesets.outputs.hasPublished }}" = "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            # Extract version from first published package JSON payload
            VERSION=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[0].version')
            echo "version=v$VERSION" >> $GITHUB_OUTPUT
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if [[ "$COMMIT_MSG" == "Version Packages"* ]]; then
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            else
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "version=latest" >> $GITHUB_OUTPUT
            fi
          fi

  build-and-push:
    name: Build & Push Docker Image
    needs: version-or-release
    if: needs.version-or-release.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo-name
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.name }}:${{ needs.version-or-release.outputs.version }}
            ghcr.io/${{ steps.repo-name.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-kubernetes:
    name: Deploy to Kubernetes Cluster
    needs: [version-or-release, build-and-push]
    runs-on: arc-runner-set-health-app
    container:
      image: node:22
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Lowercase Repository Name
        id: repo-name
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Replace Deployment Image Tag
        run: |
          sed -i "s|image: ghcr.io/jonat/health-app/healthsync:latest|image: ghcr.io/${{ steps.repo-name.outputs.name }}:${{ needs.version-or-release.outputs.version }}|g" k8s/deployment.yaml

      - name: Create Namespace if not exists
        run: |
          kubectl create namespace health-app --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Manifests
        run: |
          kubectl apply -f k8s/
